function pos(){
 const act=S.orders.filter(o=>o.s!="served");

 const requests=S.waiterRequests.filter(r=>r.status=="pending");
 if(requests.length)h+=`<section aria-label="Waiter requests" aria-live="polite">${requests.map(r=>`<div class="alert"><div><b>🙋 Waiter requested · Table ${String(r.t).padStart(2,"0")}</b><div style="font-size:12px;margin-top:4px">Requested at ${esc(r.at)} · Guest needs assistance</div></div><button class="btn r" data-a="ackwaiter" data-v="${r.id}">Acknowledge · تم الاستجابة</button></div>`).join("")}</section>`;
 if(S.pv=="orders"){
  const cnt=s=>act.filter(o=>o.s==s).length,list=act.filter(o=>(S.of=="all"||o.s==S.of)&&(!S.q||(`#${o.id} table ${o.t} `+o.items.map(i=>i.n).join(" ")).toLowerCase().includes(S.q.toLowerCase())));
  const so=S.orders.find(o=>o.id==S.so);
  h+=`<h2>Orders <span class="badge new">${act.length} Active Tickets</span></h2><p class="sub">Manage active orders and move them through preparation.</p>
  <input placeholder="Search order # or table..." value="${esc(S.q)}" data-in="q" aria-label="Search orders" style="max-width:340px">
  <div class="tabs">${[["all","ALL ACTIVE",act.length],["new","NEW",cnt("new")],["confirmed","CONFIRMED",cnt("confirmed")],["preparing","PREPARING",cnt("preparing")],["ready","READY",cnt("ready")]].map(([k,l,n])=>`<button class="chip ${S.of==k?"on":""}" data-a="of" data-v="${k}">${l} ${n}</button>`).join("")}</div>
  <div class="split"><div class="grid2">${list.map(o=>{const n=NEXT[o.s];return`<div class="oc ${S.so==o.id?"sel":""}" data-a="so" data-v="${o.id}"><div class="hd"><span>#${o.id} · Table ${String(o.t).padStart(2,"0")}</span><span class="badge ${o.s}">${o.s.toUpperCase()}</span></div><div style="color:var(--mut);font-size:12px">${o.at} · ${o.items.reduce((a,i)=>a+i.q,0)} items<br>${o.items.map(i=>i.n).join(" + ")}</div><div class="ticket-photos">${o.items.slice(0,4).map(i=>photo(S.menu.find(m=>m.id==i.id))).join("")}</div><div class="ft"><b style="font-size:16px">${fm(tot(o))}</b><button class="btn ${n[2]}" data-a="adv" data-v="${o.id}">${n[1]}</button></div></div>`}).join("")||`<div class="panel">No tickets match.</div>`}</div>
  <div class="panel">${so&&so.s!="served"?`<div style="display:flex;justify-content:space-between"><h3 style="margin:0">Order #${so.id} <span class="badge ${so.s}">${so.s.toUpperCase()}</span></h3><span style="color:var(--mut)">Table ${so.t} · ${so.at}</span></div><p style="color:var(--mut);font-size:11px">ITEMS IN TICKET (${so.items.length}) · QR MOBILE ORDER</p>${so.items.map(i=>`<div class="it"><div><b>${i.q}× ${i.n}</b><div style="color:var(--mut);font-size:12px">${i.o}</div></div><b>${fm(i.p*i.q)}</b></div>`).join("")}<div class="it" style="font-size:18px"><span>Order Subtotal</span><b>${fm(tot(so))}</b></div><button class="btn l" style="width:100%;margin-top:12px" data-a="print">🖨 Print Kitchen Ticket</button>`:`<p>Select a ticket to see details.</p>`}</div></div>`;
 }
 if(S.pv=="tables"){
  const T=S.tables,cn=s=>T.filter(t=>t.st==s).length,tt=n=>S.orders.filter(o=>o.t==n).reduce((a,o)=>a+charges(tot(o)).total,0),bill=T.filter(t=>t.st=="billing");
  h+=`<h2>Main Dining Floor <span class="badge">Zone A · Indoor</span></h2><p class="sub">Real-time floor occupancy and service signals</p>
  <div class="tabs">${[["all","All Tables",T.length],["billing","Billing",cn("billing")],["occupied","Occupied",cn("occupied")],["available","Available",cn("available")]].map(([k,l,n])=>`<button class="chip ${S.tf==k?"on":""}" data-a="tf" data-v="${k}">${l} ${n}</button>`).join("")}<button class="chip" data-a="toast" data-v="Floor refreshed">⟳ Refresh</button></div>
  ${bill.length?`<div class="alert"><span><b>${bill.length} tables awaiting cash & card settlement</b><br>${bill.map(t=>`Table ${t.n} (${fm(tt(t.n))})`).join(" · ")}</span><button class="btn r" data-a="tf" data-v="billing">View Urgent →</button></div>`:""}
  <div class="grid2">${T.filter(t=>S.tf=="all"||t.st==S.tf).map(t=>`<div class="tb ${t.st}" data-a="tbl" data-v="${t.n}" role="button" tabindex="0"><div style="display:flex;justify-content:space-between"><b style="${t.st=="billing"?"color:var(--rust)":""}">Table ${String(t.n).padStart(2,"0")}</b><span class="badge ${t.st=="available"?"ready":t.st=="billing"?"new":""}">${t.st.toUpperCase()}</span></div><span style="color:var(--mut)">${t.seats} seats</span><div style="margin-top:auto;display:flex;justify-content:space-between;align-items:end">${t.st=="available"?`<small style="color:var(--mut)">QR Code Active</small><small>Tap to seat →</small>`:`<small>${t.st=="billing"?"DUE TOTAL":"Running Tab"}</small><b style="font-size:${t.st=="billing"?24:16}px;${t.st=="billing"?"color:var(--rust)":""}">${fm(tt(t.n))}</b>`}</div></div>`).join("")}</div>`;
 }
 if(S.pv=="table"){
  const t=S.tables.find(x=>x.n==S.st),os=S.orders.filter(o=>o.t==t.n),sum=os.reduce((a,o)=>a+charges(tot(o)).total,0);
  h+=`<div style="margin-top:14px"><button class="btn l" data-a="pv" data-v="tables">← Back to Tables</button></div><h2>Table ${String(t.n).padStart(2,"0")} <span class="badge ${t.st=="billing"?"new":t.st=="available"?"ready":""}">${t.st}</span></h2><p class="sub">${t.seats} seats · Zone A · Floor 1</p>
  <div class="split"><div class="panel"><h3 style="margin-top:0">Active Orders <span class="badge">${os.length}</span> <span style="float:right">Total Tab: ${fm(sum)}</span></h3>${os.map(o=>`<div class="it" style="display:block"><b>Order #${o.id}</b> <span class="badge ${o.s}">${o.s.toUpperCase()}</span>${o.items.map(i=>`<div style="display:flex;justify-content:space-between;margin-top:6px"><span>${i.q}× ${i.n}<br><small style="color:var(--mut)">${i.o}</small></span><b>${fm(i.p*i.q)}</b></div>`).join("")}</div>`).join("")||"<p>No orders yet.</p>"}
  <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">${t.st=="available"?`<button class="btn" data-a="seat" data-v="${t.n}">Seat guests</button>`:`<button class="btn" data-a="bill" data-v="${t.n}">🧾 Request Bill / Print Pre-Check</button><button class="btn l" data-a="toast" data-v="Transfer table dialog (demo)">⇄ Transfer Table</button><button class="btn l" data-a="toast" data-v="Waiter acknowledged">✓ Call Waiter Ack</button>${t.st=="billing"?`<button class="btn g" data-a="pay" data-v="${t.n}">Mark Paid & Clear</button>`:""}`}</div></div>
  <div class="panel" style="text-align:center"><span class="badge ready">● QR Active & Linked</span><h3>Dynamic Table QR</h3><div class="qr" aria-label="QR code placeholder"></div><p style="color:var(--mut);font-size:12px">Guests scan to view the live menu and order from Table ${String(t.n).padStart(2,"0")}.</p><button class="btn r" data-a="toast" data-v="Slip sent to printer">🖨 Print Slip</button></div></div>`;
 }
 if(S.pv=="menu"){
  const all=S.menu,list=all.filter(m=>S.mc=="All"||m.c==S.mc),e=all.find(m=>m.id==S.me);
  h+=`<div style="display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:8px"><div><h2>Menu Management</h2><p class="sub" style="margin:0">Manage your categories, dishes, prices and guest ordering availability.</p></div><button class="btn r" data-a="addp">⊕ Add Product</button></div>
  <div class="tabs" style="margin-top:14px">${["All",...CATS].map(c=>`<button class="chip ${S.mc==c?"on":""}" data-a="mc" data-v="${c}">${categoryLabel(c)} ${c=="All"?all.length:all.filter(m=>m.c==c).length}</button>`).join("")}</div>
  <div class="split"><div class="grid2 menu-products">${list.map(m=>`<div class="oc ${S.me==m.id?"sel":""}" data-a="me" data-v="${m.id}" style="${m.a?"":"opacity:.6"}"><div class="em" style="height:120px;border-radius:10px;font-size:48px;${m.a?"":"filter:grayscale(1)"}">${photo(m)}</div><div class="hd"><span>${esc(m.n)}</span><span class="pr">${fm(m.p)}</span></div><small style="color:var(--mut)">${m.c} · ${m.sz.length} variants · ${m.ex.length} extras</small><div class="ft"><small style="color:${m.a?"var(--ok)":"var(--mut)"}">${m.a?"● Live in Menu":"● Unavailable (Hidden)"}</small><button class="btn l" data-a="me" data-v="${m.id}">Edit</button></div></div>`).join("")}</div>
  <div class="panel">${e?`<small style="color:var(--mut)">PRODUCT EDITOR</small><h3 style="margin:2px 0 12px">${esc(e.n)}</h3><label>Dish Name<input data-in="en" value="${esc(e.n)}"></label><label>Category<select data-in="ec">${CATS.map(c=>`<option ${c==e.c?"selected":""}>${c}</option>`).join("")}</select></label><label>Base Price (EGP)<input type="number" min="0" data-in="ep" value="${e.p}"></label><label>Description<textarea rows="3" data-in="ed">${esc(e.d)}</textarea></label>
  <div class="oc" style="flex-direction:row;justify-content:space-between;align-items:center;cursor:default;background:#eaf4ff"><div><b>Available for Ordering</b><br><small>When turned off, guests cannot order this dish. Still visible to staff in POS.</small></div><button class="sw ${e.a?"on":""}" data-a="avail" data-v="${e.id}" role="switch" aria-checked="${!!e.a}" aria-label="Available for ordering"></button></div>
  <h4>Portion Sizes / Variants</h4>${e.sz.map(s=>`<div class="it"><span>${s[0]}</span><b>${s[1]?"+"+s[1]:"Base"} EGP</b></div>`).join("")}<button class="btn" style="width:100%;margin-top:14px" data-a="save">Save changes</button>`:"<p>Select a dish to edit.</p>"}</div></div>`;
 }
 h+=`<nav class="pnav">${[["orders","Orders"],["tables","Tables"],["menu","Menu"]].map(([k,l])=>`<button class="${S.pv==k?"on":""}" data-a="pv" data-v="${k}">${l}</button>`).join("")}</nav></div>`;
 return h;
}
/* ---------- actions ---------- */
function A(a,v){
 const bk=()=>S.mode+S.gv+S.pv+(S.sel||'')+(S.st||'');const b0=bk();
 const cur=()=>S.menu.find(m=>m.id==S.sel);
 const addLine=(m,sz,ex,q)=>{const opt=[m.sz[sz][0],...ex.map(i=>m.ex[i][0])].join(" · "),p=m.p+m.sz[sz][1]+ex.reduce((x,i)=>x+m.ex[i][1],0),f=S.cart.find(l=>l.id==m.id&&l.o==opt);f?f.q+=q:S.cart.push({id:m.id,n:m.n,o:opt,p,q})};
 switch(a){
 case"mode":S.mode=v;break;case"reset":S=seed();S.tables.find(t=>t.n==4).st="billing";toast("Demo reset");break;
 case"callwaiter":{
  if(S.waiterRequests.some(r=>r.t==5&&r.status=="pending")){toast("Your waiter has already been called");break}
  S.waiterRequests.push({id:S.nextWaiterRequest++,t:5,status:"pending",at:new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Africa/Cairo"})});toast("Waiter requested for Table 05");break;
 }
 case"ackwaiter":{
  const request=S.waiterRequests.find(r=>r.id==+v);if(request&&request.status=="pending"){request.status="acknowledged";toast(`Waiter request acknowledged · Table ${request.t}`)}break;
 }
 case"gv":S.gv=v;break;case"cat":S.cat=v;break;
 case"open":S.sel=+v;S.sz=0;S.ex=[];S.qty=1;break;case"close":S.sel=null;break;
 case"quick":{addLine(S.menu.find(m=>m.id==v),0,[],1);toast("Added to order");break}
 case"sz":S.sz=+v;break;
 case"ex":{const k=+v,i=S.ex.indexOf(k);if(i>=0)S.ex.splice(i,1);else if(S.ex.length<3)S.ex.push(k);else toast("Up to 3 extras");break}
 case"q":S.qty=Math.max(1,S.qty+ +v);break;
 case"add":addLine(cur(),S.sz,S.ex,S.qty);S.sel=null;toast("Added to order");break;
 case"cq":{const[k,d]=v.split(",");S.cart[k].q+=+d;if(S.cart[k].q<1)S.cart.splice(k,1);break}
 case"place":{if(!S.cart.length)return;const n=new Date();S.orders.push({id:S.nid++,t:5,s:"new",at:n.getHours()+":"+String(n.getMinutes()).padStart(2,"0"),items:S.cart.map(l=>({...l}))});S.cart=[];S.gv="done";S.last=S.nid-1;break}
 case"pv":S.pv=v;break;case"of":S.of=v;break;case"so":S.so=+v;break;
 case"adv":{const o=S.orders.find(x=>x.id==v);o.s=NEXT[o.s][0];S.so=o.id;toast(`Order #${o.id} → ${o.s}`);break}
 case"print":toast("Kitchen ticket sent to printer");break;case"toast":toast(v);break;
 case"tf":S.tf=v;break;case"tbl":S.st=+v;S.pv="table";break;
 case"seat":S.tables.find(t=>t.n==v).st="occupied";toast("Guests seated");break;
 case"bill":S.tables.find(t=>t.n==v).st="billing";toast("Pre-check printed · table marked Billing");break;
 case"pay":S.orders=S.orders.filter(o=>o.t!=v);S.tables.find(t=>t.n==v).st="available";S.pv="tables";toast("Payment recorded · table cleared");break;
 case"mc":S.mc=v;break;case"me":S.me=+v;break;
 case"avail":{const m=S.menu.find(x=>x.id==v);m.a=m.a?0:1;toast(m.a?"Dish live in menu":"Dish hidden from guests");break}
 case"save":toast("Product saved");break;
 case"addp":{const id=Math.max(...S.menu.map(m=>m.id))+1;S.menu.push({id,n:"New Dish",c:S.mc=="All"?"Omelettes":S.mc,p:100,e:"🍽",a:0,d:"Describe this dish.",sz:[["Standard",0]],ex:[]});S.me=id;break}
 }
 $('#app').className=bk()!=b0?'fx':'';render();
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;if(b.dataset.a=="open"&&e.target.closest("[data-a=quick]"))return;A(b.dataset.a,b.dataset.v)});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.dataset&&e.target.dataset.a)e.target.click()});
document.addEventListener("input",e=>{const k=e.target.dataset.in;if(!k)return;const m=S.menu.find(x=>x.id==S.me);
 if(k=="q"){S.q=e.target.value;const p=e.target.selectionStart;render();const i=$("[data-in=q]");i.focus();i.setSelectionRange(p,p)}
 else if(k=="en")m.n=e.target.value;else if(k=="ec"){m.c=e.target.value;render()}else if(k=="ep")m.p=+e.target.value||0;else if(k=="ed")m.d=e.target.value});
render();
</script></body></html>
